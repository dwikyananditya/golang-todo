syntax = "proto3";

package todo.v1;

import "buf/validate/validate.proto";

option go_package = "todo/internal/pb;pb";

message Todo {
  int64 id = 1;
  string title = 2;
  string description = 3;
  bool is_done = 4;
}

message CreateTodoRequest {
  string title = 1 [(buf.validate.field).cel = {
    id: "title.required"
    message: "title wajib diisi"
    expression: "this.size() > 0"
  }];
  string description = 2 [(buf.validate.field).cel = {
    id: "description.required"
    message: "description wajib diisi"
    expression: "this.size() > 0"
  }];
  bool is_done = 3;
}

message CreateTodoResponse {
  Todo todo = 1;
}

enum SortOrder {
  SORT_ORDER_UNSPECIFIED = 0;
  SORT_ORDER_ASC = 1;
  SORT_ORDER_DESC = 2;
}

message GetTodoRequest {
  SortOrder order = 1;
}

message GetTodoResponse {
  Todo todo = 1;
}

message ListTodosRequest {
  SortOrder order = 1;
}

message ListTodosResponse {
  repeated Todo todos = 1;
}

message UpdateTodoRequest {
  int64 id = 1 [(buf.validate.field).cel = {
    id: "id.positive"
    message: "id harus > 0"
    expression: "this > 0"
  }];
  string title = 2 [(buf.validate.field).cel = {
    id: "title.required"
    message: "title wajib diisi"
    expression: "this.size() > 0"
  }];
  string description = 3 [(buf.validate.field).cel = {
    id: "description.required"
    message: "description wajib diisi"
    expression: "this.size() > 0"
  }];
  bool is_done = 4;
}

message UpdateTodoResponse {
  Todo todo = 1;
}

message DeleteTodoRequest {
  int64 id = 1 [(buf.validate.field).cel = {
    id: "id.positive"
    message: "id harus > 0"
    expression: "this > 0"
  }];
}

message DeleteTodoResponse {}

service TodoService {
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse);
  rpc GetTodo(GetTodoRequest) returns (GetTodoResponse);
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse);
  rpc UpdateTodo(UpdateTodoRequest) returns (UpdateTodoResponse);
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse);
}
